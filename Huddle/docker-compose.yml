services:
  # ----------------------------------------------------
  # DATABASE (POSTGRESQL)
  # ----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # CACHE (REDIS)
  # ----------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # SHARED MICROSERVICE (BUSINESS LOGIC & DATA)
  # ----------------------------------------------------
  microservice:
    build:
      context: ./microservices
      dockerfile: docker/django/Dockerfile
    container_name: shared-microservice
    env_file:
      - ./microservices/.env
    environment:
      - REDIS_URL=redis://redis-cache:6379/0
      - DOCKER_ENV=True
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  # ----------------------------------------------------
  # BACKEND1 (APP1 AUTHENTICATION SERVICE)
  # ----------------------------------------------------
  backend1:
    build:
      context: ./app1/backend1
      dockerfile: Dockerfile
    container_name: auth-backend1
    env_file:
      - ./app1/backend1/.env
    ports:
      - "5000:5000"
    depends_on:
      postgres-db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:5000
      "

  # ----------------------------------------------------
  # BACKEND2 (APP2 AUTHENTICATION SERVICE)
  # ----------------------------------------------------
  #backend2:
    #build:
      #context: ./app2/backend2
      #dockerfile: Dockerfile
    #container_name: auth-backend2
    #env_file:
      #- .env
    #ports:
      #- "8003:8003"
    #depends_on:
      #postgres-db:
       # condition: service_healthy
    #command: >
      #sh -c "
      #python manage.py migrate &&
      #python manage.py runserver 0.0.0.0:8003
     # "

  # ----------------------------------------------------
  # APP1 (REACT HUDDLE APPLICATION 1)
  # ----------------------------------------------------
  app1:
    build:
      context: ./app1/frontend1
      dockerfile: Dockerfile
    container_name: react-app1
    environment:
      - VITE_DOCKER=true
    ports:
      - "3000:3000"
    depends_on:
      - backend1
      - microservice

  # ----------------------------------------------------
  # LIVEKIT SERVER (LOCAL)
  # ----------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --node-ip=127.0.0.1 --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - "LIVEKIT_KEYS=devkey: secret"
      - LIVEKIT_REDIS_URL=redis://redis-cache:6379/0
    depends_on:
      redis-cache:
        condition: service_healthy

  # ----------------------------------------------------
  # CLOUDFLARED TUNNEL (EXPOSES APP1)
  # ----------------------------------------------------
  cloudflare-frontend:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-frontend
    restart: unless-stopped
    command: tunnel --url http://app1:3000
    depends_on:
      - app1

  # ----------------------------------------------------
  # CLOUDFLARED TUNNEL (EXPOSES LIVEKIT)
  # ----------------------------------------------------
  cloudflare-livekit:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-livekit
    restart: unless-stopped
    command: tunnel --url http://livekit:7880
    depends_on:
      - livekit