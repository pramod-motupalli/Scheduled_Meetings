services:


  # ----------------------------------------------------
  # CACHE (REDIS)
  # ----------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # SHARED MICROSERVICE (BUSINESS LOGIC & DATA)
  # ----------------------------------------------------
  microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shared-microservice
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-cache:6379/0
      - DOCKER_ENV=True
    ports:
      - "8000:8000"
    depends_on:
      redis-cache:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

